[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "footops-agent"
version = "0.1.0"
description = "FootOps LLM planning service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "agentscope==2.0.5",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "redis>=5.2,<7",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
agentscope-app = [
  "agentscope[service,storage-redis]==2.0.5",
]
agentscope-sql = [
  "agentscope[storage-sql]==2.0.5",
  "aiomysql>=0.3,<1",
]
test = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
]

[project.scripts]
footops-agent = "footops_agent.api.main:run"
footops-data-audit = "footops_agent.cli.data_audit:run"
footops-eval = "footops_agent.cli.evaluate:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
